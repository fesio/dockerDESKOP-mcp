name: evo-mcp

x-evo-common: &evo-common
  build:
    context: .
    target: runtime
  image: evo-mcp-node:local
  init: true
  restart: unless-stopped
  env_file: [.env]
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
    - /home/appuser:size=64m,uid=10001,gid=10001,mode=0700
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  mem_limit: 768m
  cpus: 1.5
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 10s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-evo-environment: &evo-environment
  MCP_BIND_HOST: 0.0.0.0
  MCP_PORT: 8000
  MCP_TRUST_PROXY: "false"
  MCP_ALLOWED_HOSTS: "127.0.0.1:*,localhost:*,[::1]:*,evo-mcp-apps:8000,evo-mcp-n8n:8000"
  MCP_ALLOWED_ORIGINS: "http://127.0.0.1:*,http://localhost:*,http://[::1]:*"
  PROGRAMMER_WORKSPACE: /workspace
  BRAIN_VAULT_PATH: /brain
  NOTEBOOKLM_IMPORT_PATH: /brain/imports/notebooklm

services:
  evo-mcp-apps:
    <<: *evo-common
    container_name: evo-mcp-apps
    environment:
      <<: *evo-environment
      MCP_TOOL_PROFILE: apps
      AUDIT_LOG_PATH: /data/audit.jsonl
      TASK_DB_PATH: /data/tasks.sqlite3
      TASK_ARTIFACT_DIR: /data/task-artifacts
    ports: ["127.0.0.1:${LOCAL_MCP_PORT:-8765}:8000"]
    volumes:
      - evo_mcp_workspace:/workspace
      - evo_mcp_data:/data
      - evo_mcp_brain:/brain:ro

  evo-mcp-n8n:
    <<: *evo-common
    container_name: evo-mcp-n8n
    environment:
      <<: *evo-environment
      MCP_TOOL_PROFILE: n8n
      AUDIT_LOG_PATH: /data/audit.jsonl
      TASK_DB_PATH: /data/tasks.sqlite3
      TASK_ARTIFACT_DIR: /data/task-artifacts
    ports: ["127.0.0.1:${LOCAL_MCP_N8N_PORT:-8766}:8000"]
    volumes:
      - evo_mcp_n8n_data:/data

  n8n:
    profiles: [n8n]
    image: docker.n8n.io/n8nio/n8n:2.40.5
    container_name: evo-n8n
    restart: unless-stopped
    env_file: [.env]
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_MCP_SERVER_RATE_LIMIT: "100"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Warsaw}
      TZ: ${GENERIC_TIMEZONE:-Europe/Warsaw}
    ports: ["127.0.0.1:${LOCAL_N8N_PORT:-5678}:5678"]
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/files
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://127.0.0.1:5678/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  evo_mcp_data: {name: evo_mcp_data, external: true}
  evo_mcp_n8n_data: {name: evo_mcp_n8n_data}
  evo_mcp_workspace: {name: evo_mcp_workspace, external: true}
  evo_mcp_brain: {name: evo_mcp_brain, external: true}
  n8n_data: {}
  n8n_files: {}
